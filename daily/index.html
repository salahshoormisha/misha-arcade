<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Today's Run · Midnight Arcade</title>
<meta name="theme-color" content="#0a0910">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230a0910'/><circle cx='16' cy='16' r='6' fill='none' stroke='%23ff5c9d' stroke-width='2.5'/></svg>">
<link rel="stylesheet" href="../core/style.css?v=11">
<style>
  /* ── the card: one big number, three supporting facts ─────────────────── */
  .top {
    display: flex; align-items: center; gap: var(--sp-5);
    padding: var(--sp-5) 0 var(--sp-4); flex-wrap: wrap;
  }
  .dial { position: relative; width: 116px; height: 116px; flex: 0 0 auto; }
  .dial svg { transform: rotate(-90deg); display: block; }
  .dial .mid { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
  .dial .mid b {
    font-family: var(--display); font-size: 34px; font-weight: 700; line-height: 1;
    letter-spacing: -.03em; color: var(--ink); font-variant-numeric: tabular-nums;
  }
  .dial .mid span {
    display: block; margin-top: 3px; font-size: 9px; letter-spacing: .16em;
    text-transform: uppercase; color: var(--ink-4);
  }
  .facts { flex: 1 1 220px; min-width: 0; }
  .facts h1 {
    font-family: var(--display); font-size: clamp(22px, 5vw, 30px); font-weight: 700;
    letter-spacing: -.025em; color: var(--ink); line-height: 1.1;
  }
  .facts .date {
    margin-top: 5px; font-size: var(--t-xs); letter-spacing: .14em;
    text-transform: uppercase; color: var(--ink-4);
  }
  .facts .stats { display: flex; gap: var(--sp-4); margin-top: var(--sp-4); flex-wrap: wrap; }
  .facts .stats div { line-height: 1.25; }
  .facts .stats b {
    display: block; font-family: var(--display); font-size: var(--t-xl);
    font-weight: 680; color: var(--ink); font-variant-numeric: tabular-nums;
  }
  .facts .stats span { font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-4); }
  .actions { display: flex; gap: var(--sp-2); flex-wrap: wrap; margin-top: var(--sp-4); }

  /* ── suggested set ────────────────────────────────────────────────────── */
  .suggest {
    border: 1px solid var(--hair); border-left: 2px solid var(--amber);
    border-radius: var(--r-md); padding: var(--sp-4); margin-top: var(--sp-5);
    background: rgba(239, 190, 90, .045);
  }
  .suggest h4 {
    font-family: var(--display); font-size: var(--t-xs); font-weight: 650;
    letter-spacing: .16em; text-transform: uppercase; color: var(--amber);
  }
  .suggest p { font-size: var(--t-sm); color: var(--ink-2); line-height: 1.7; margin-top: 6px; }
  .suggest p b { color: var(--ink); font-weight: 600; }

  /* ── the list ─────────────────────────────────────────────────────────── */
  .set { margin-top: var(--sp-6); }
  .set h3 {
    display: flex; align-items: baseline; gap: var(--sp-3);
    font-family: var(--display); font-size: var(--t-xs); font-weight: 600;
    letter-spacing: .2em; text-transform: uppercase; color: var(--ink-4);
    margin-bottom: var(--sp-3);
  }
  .set h3::after { content: ""; flex: 1; height: 1px; background: var(--hair); }
  .set h3 i {
    font-style: normal; letter-spacing: .01em; text-transform: none;
    font-weight: 400; font-size: var(--t-sm); color: var(--ink-4);
  }

  .cab {
    display: flex; align-items: center; gap: var(--sp-3);
    border: 1px solid var(--hair); border-radius: var(--r-md);
    padding: var(--sp-3); margin-bottom: 6px; background: var(--s1);
    transition: border-color var(--fast) var(--ease), background var(--fast) var(--ease),
                transform var(--fast) var(--ease);
  }
  .cab:hover {
    border-color: var(--hair-2); background: var(--s2);
    transform: translateX(2px); text-decoration: none;
  }
  .cab .ic {
    width: 32px; height: 32px; flex: 0 0 auto; border-radius: var(--r-sm);
    display: grid; place-items: center; font-size: 15px;
    background: rgba(255,255,255,.045); border: 1px solid var(--hair);
  }
  .cab .txt { flex: 1 1 auto; min-width: 0; }
  .cab .txt b {
    display: block; font-family: var(--display); font-size: var(--t-sm);
    font-weight: 650; letter-spacing: .07em; text-transform: uppercase; color: var(--a);
  }
  .cab .txt i {
    display: block; font-style: normal; font-size: var(--t-xs); color: var(--ink-4);
    margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .cab .st { flex: 0 0 auto; text-align: right; }
  .cab .st .n {
    display: block; font-family: var(--display); font-size: var(--t-lg);
    font-weight: 700; color: var(--ink); line-height: 1.1; font-variant-numeric: tabular-nums;
  }
  .cab .st .d { font-size: 10px; letter-spacing: .06em; color: var(--ink-4); }
  .cab .st .go {
    font-size: 10px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
    color: var(--a); opacity: .85;
  }
  .cab.done { background: rgba(255,255,255,.02); }
  .cab .meter {
    display: block; width: 54px; height: 3px; border-radius: 9px;
    background: rgba(255,255,255,.08); margin-top: 5px; overflow: hidden;
  }
  .cab .meter i { display: block; height: 100%; background: var(--a); }
  .netwarn { color: var(--amber); }
  .cab.soon { opacity: .45; cursor: default; }
  .cab.soon:hover { transform: none; background: var(--s1); border-color: var(--hair); }

  footer {
    margin-top: var(--sp-7); padding-top: var(--sp-4); border-top: 1px solid var(--hair);
    text-align: center; font-size: var(--t-xs); color: var(--ink-4); line-height: 1.8;
  }
</style>
</head>
<body>
<script src="../core/registry.js?v=11"></script>
<script src="../core/arcade.js?v=11"></script>
<script src="../core/ui.js?v=11"></script>
<script src="../core/audio.js?v=11"></script>
<script>
(function () {
  var main = A.mount({ title: "Today's Run", sub: null, wide: true, accent: "--hot" });
  var dayN = A.dayNumber();
  var pct = function (n) { return Math.max(0, Math.min(100, n)); };

  function render() {
    var card = A.card(dayN), rs = A.runStreak();
    var playable = A.registry.filter(function (g) { return !g.soon; });
    var total = playable.length;
    var left = playable.filter(function (g) { return !A.isDone(g.id, dayN); });
    var mins = Math.round(left.reduce(function (a, g) { return a + (g.parMs || 150000); }, 0) / 60000);
    var C = 2 * Math.PI * 50;

    var h = '<div class="top"><div class="dial">' +
      '<svg width="116" height="116" viewBox="0 0 116 116" aria-hidden="true">' +
      '<circle cx="58" cy="58" r="50" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="6"/>' +
      '<circle cx="58" cy="58" r="50" fill="none" stroke="var(--accent)" stroke-width="6" ' +
      'stroke-linecap="round" stroke-dasharray="' + C + '" stroke-dashoffset="' +
      (C * (1 - pct(card.total) / 100)) + '"/>' +
      "</svg>" +
      '<div class="mid"><div><b>' + card.total + "</b><span>Card</span></div></div></div>";

    h += '<div class="facts"><h1>' +
      (card.played === 0 ? "Nothing played yet"
        : card.played === total ? "Clean sweep." : "Good start.") + "</h1>" +
      '<div class="date">Day ' + dayN + " · " + A.prettyDate(dayN) + "</div>" +
      '<div class="stats">' +
      "<div><b>" + rs.current + "</b><span>Day run</span></div>" +
      "<div><b>" + card.played + "/" + total + "</b><span>Played</span></div>" +
      (left.length ? "<div><b>" + mins + "</b><span>Min left</span></div>"
        : "<div><b>100%</b><span>Complete</span></div>") +
      "</div>" +
      '<div class="actions">' +
      '<button class="ac-btn sm" id="shareCard">Share card</button>' +
      '<button class="ac-btn ghost sm" id="shareImg">Share as image</button>' +
      '<a class="ac-btn ghost sm" href="../league/">Misha v David</a>' +
      '<a class="ac-btn ghost sm" href="../passport/">Passport</a>' +
      "</div></div></div>";

    if (left.length > 5) {
      var set = suggestSet(left);
      h += '<div class="suggest"><h4>Tonight\'s set</h4><p>Five games, one from each wing, about ' +
        Math.round(set.reduce(function (a, g) { return a + g.parMs; }, 0) / 60000) + " minutes — " +
        set.map(function (g) { return "<b>" + A.esc(g.name) + "</b>"; }).join(", ") + ".</p>" +
        '<div class="actions" style="margin-top:10px"><a class="ac-btn sm" href="../games/' +
        set[0].id + '/">Start with ' + A.esc(set[0].name) + "</a></div></div>";
    }

    Object.keys(window.AD_FAMILIES).forEach(function (fam) {
      var F = window.AD_FAMILIES[fam];
      var list = A.registry.filter(function (g) { return g.family === fam; });
      if (!list.length) return;
      h += '<div class="set"><h3>' + A.esc(F.name) + " <i>" + A.esc(F.note) + "</i></h3>";
      list.forEach(function (g) {
        var st = A.load(g.id, dayN), done = st && st.done;
        // A cabinet that isn't built yet is rendered as a dead row rather than
        // a link that 404s — a broken link reads as a broken product.
        var tag = g.soon ? "span" : "a";
        h += "<" + tag + ' class="cab ' + (done ? "done" : "") + (g.soon ? " soon" : "") + '"' +
          (g.soon ? "" : ' href="../games/' + g.id + '/"') +
          ' style="--a:var(' + g.accent + ')">' +
          '<span class="ic">' + g.icon + "</span>" +
          '<span class="txt"><b>' + A.esc(g.name) + "</b><i>" + A.esc(g.tagline) +
          (g.needsNet ? ' <span class="netwarn">· needs wifi</span>' : "") + "</i>" +
          (done ? '<span class="meter"><i style="width:' + pct(st.norm) + '%"></i></span>' : "") +
          "</span>" +
          '<span class="st">' + (g.soon
            ? '<span class="go" style="color:var(--ink-4)">Soon</span>'
            : done
              ? '<span class="n">' + st.norm + '</span><span class="d">' + A.esc(st.detail || "") + "</span>"
              : '<span class="go">Play →</span>') +
          "</span></" + tag + ">";
      });
      h += "</div>";
    });

    h += "<footer>Every puzzle here is the same for you and for David, worked out from the date.<br>" +
      "No server, no accounts, no idea what anyone else scored.<br><br>" +
      '<a href="../">← Back to the arcade</a></footer>';

    main.innerHTML = h;
    var sc = document.getElementById("shareCard");
    if (sc) sc.onclick = function () {
      if (!card.played) return A.toast("Play something first", true);
      A.share(A.runCard(dayN));
    };
    var si = document.getElementById("shareImg");
    if (si) si.onclick = function () {
      if (!card.played) return A.toast("Play something first", true);
      si.disabled = true;
      A.shareCardImage(dayN).then(function () { si.disabled = false; },
                                  function () { si.disabled = false; });
    };
  }

  function suggestSet(left) {
    var rand = A.rngFor("set", dayN), out = [], seen = {};
    Object.keys(window.AD_FAMILIES).forEach(function (fam) {
      var pool = left.filter(function (g) { return g.family === fam && (!g.needsNet || navigator.onLine); });
      if (!pool.length) pool = left.filter(function (g) { return g.family === fam; });
      if (pool.length) { var g = A.pick(rand, pool); out.push(g); seen[g.id] = 1; }
    });
    while (out.length < 5) {
      var extra = left.filter(function (g) { return !seen[g.id]; });
      if (!extra.length) break;
      var e = A.pick(rand, extra); seen[e.id] = 1; out.push(e);
    }
    return out.slice(0, 5).sort(function (a, b) { return a.parMs - b.parMs; });
  }

  render();
  A.on("finish", render);
  if (A.backupDue()) setTimeout(function () { A.toast("Back up your streaks — settings", true); }, 1400);
  setTimeout(function () { location.reload(); }, A.msToMidnight() + 2000);
})();
</script>
</body>
</html>
