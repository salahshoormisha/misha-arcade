<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FLAGLE · Midnight Arcade</title>
<meta name="theme-color" content="#070312">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏳️</text></svg>">
<link rel="stylesheet" href="../../core/style.css?v=4">
<style>
  #flagwrap { position: relative; width: min(400px, 88vw); margin: 12px auto 0; }
  #flag { width: 100%; display: block; border-radius: 8px; background: #0d0722;
          box-shadow: 0 8px 30px #0008; }
  .guesses { max-width: 400px; margin: 14px auto 0; }
  .gr {
    display: flex; align-items: center; gap: 8px; padding: 8px 11px; margin-bottom: 6px;
    border: 1px solid var(--line); border-radius: 10px; background: #ffffff07; font-size: 13px;
  }
  .gr img { width: 26px; height: 17px; object-fit: cover; border-radius: 2px; flex: 0 0 auto; }
  .gr .nm { flex: 1 1 auto; letter-spacing: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gr .km { color: var(--ink3); font-size: 11.5px; }
  .gr .ar { font-size: 15px; }
  .gr .pc { width: 42px; text-align: right; font-weight: 800; }
  .gr.win { border-color: var(--ok); background: rgba(61,224,138,.1); }
  .gr.win .pc { color: var(--ok); }
  .tries { display: flex; gap: 5px; justify-content: center; margin-top: 10px; }
  .tries i { width: 26px; height: 5px; border-radius: 9px; background: #ffffff18; }
  .tries i.used { background: var(--bad); }
  .tries i.won { background: var(--ok); }
  .hintbox { font-size: 12px; color: var(--gold); text-align: center; margin-top: 9px; line-height: 1.7; }
</style>
</head>
<body>
<script src="../../core/registry.js?v=4"></script>
<script src="../../core/arcade.js?v=4"></script>
<script src="../../core/ui.js?v=4"></script>
<script src="../../core/audio.js?v=4"></script>
<script src="../../core/flagart.js?v=4"></script>
<script src="../../core/data/countries.js?v=4"></script>
<script src="../../core/data/flags.js?v=4"></script>
<script src="../../core/picker.js?v=4"></script>
<script src="game.js?v=4"></script>
</body>
</html>
