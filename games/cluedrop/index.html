<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CLUEDROP · Midnight Arcade</title>
<meta name="theme-color" content="#0a0910">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔎</text></svg>">
<link rel="stylesheet" href="../../core/style.css?v=11">
<style>
  /* ── CLUEDROP — design tokens only. Every colour, size and metric below is a
     variable from core/style.css, so the polish pass owns the look. ─────── */

  /* the counter above the input: which clue you are on, and how many are left */
  .meter { max-width: 440px; margin: var(--sp-3) auto 0; text-align: center; }
  .meter .lb {
    font-size: var(--t-xs); font-weight: 550; letter-spacing: .18em;
    text-transform: uppercase; color: var(--ink-4);
  }
  .meter .bar {
    display: flex; gap: var(--sp-1); justify-content: center; margin-top: var(--sp-2);
  }
  .meter .bar i {
    width: 30px; max-width: 12vw; height: 5px; border-radius: var(--r-full);
    background: var(--s3); transition: background var(--slow) var(--ease);
  }
  .meter .bar i.on  { background: var(--accent); }
  .meter .bar i.won { background: var(--ok); }
  .meter .bar i.out { background: var(--bad); }

  /* ── the tape: clue, guess, clue, guess… appended in play order ─────────
     Append-only, and it lives BELOW the picker, so revealing a clue never
     moves anything the player is touching. */
  .tape { max-width: 440px; margin: var(--sp-4) auto 0; }

  .cl {
    display: flex; gap: var(--sp-3); align-items: flex-start;
    padding: var(--sp-3); margin-bottom: var(--sp-2);
    border: 1px solid var(--hair); border-radius: var(--r-md);
    background: var(--s2);
  }
  .cl.fresh { animation: cl-in var(--slow) var(--ease); }
  @keyframes cl-in { from { opacity: 0; transform: translateY(-6px); } }
  .cl .n {
    flex: 0 0 auto; width: 22px; height: 22px; border-radius: var(--r-full);
    display: grid; place-items: center;
    border: 1px solid var(--hair-2); background: var(--s1);
    font-family: var(--mono); font-size: var(--t-xs); font-weight: 650;
    color: var(--ink-3);
  }
  .cl .bd { flex: 1 1 auto; min-width: 0; }
  .cl .lb {
    font-size: var(--t-xs); font-weight: 550; letter-spacing: .16em;
    text-transform: uppercase; color: var(--accent);
  }
  .cl .tx { font-size: var(--t-sm); color: var(--ink); line-height: 1.65; margin-top: 3px; }
  .cl .ex { font-size: var(--t-sm); color: var(--ink-3); line-height: 1.65; margin-top: var(--sp-1); }
  /* clues the player never had to pay for, shown after the round */
  .cl.spent { background: transparent; border-style: dashed; }
  .cl.spent .lb { color: var(--ink-4); }
  .cl.spent .tx { color: var(--ink-3); }

  .tapehd {
    font-size: var(--t-xs); font-weight: 550; letter-spacing: .18em;
    text-transform: uppercase; color: var(--ink-4);
    text-align: center; margin: var(--sp-4) 0 var(--sp-2);
  }

  /* ── guess rows — same markup and metrics as FLAGLE, on purpose ────────── */
  .gr {
    display: flex; align-items: center; gap: var(--sp-2);
    padding: var(--sp-2) var(--sp-3); margin-bottom: var(--sp-2);
    border: 1px solid var(--hair); border-radius: var(--r-md);
    background: var(--s1); font-size: var(--t-sm);
    animation: cl-in var(--fast) var(--ease);
  }
  .gr img { width: 26px; height: 17px; object-fit: cover; border-radius: 2px; flex: 0 0 auto; }
  /* min-width:0 is what stops "Central African Republic" from refusing to shrink
     and squeezing the distance column onto a second line. */
  .gr .nm { flex: 1 1 auto; min-width: 0; letter-spacing: .04em;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gr .km { flex: 0 0 auto; white-space: nowrap; color: var(--ink-3);
            font-size: var(--t-xs); font-variant-numeric: tabular-nums; }
  .gr .ar { flex: 0 0 auto; font-size: var(--t-md); line-height: 1; }
  .gr .pc { flex: 0 0 auto; width: 42px; text-align: right; font-weight: 650;
            font-variant-numeric: tabular-nums; }
  .gr.win { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); }
  .gr.win .pc { color: var(--ok); }
  .gr.win .ar { color: var(--ok); font-weight: 650; }

  /* ── the reveal inside the result sheet ───────────────────────────────── */
  .rv-name {
    font-family: var(--display); font-size: var(--t-lg); font-weight: 700;
    letter-spacing: .08em; text-align: center;
  }
  .rv-meta {
    font-size: var(--t-xs); letter-spacing: .08em; color: var(--ink-3);
    text-align: center; margin-top: var(--sp-1); line-height: 1.8;
  }
  .rv-hd {
    font-size: var(--t-xs); font-weight: 550; letter-spacing: .16em;
    text-transform: uppercase; color: var(--ink-4);
    text-align: center; margin: var(--sp-4) 0 var(--sp-2);
  }
  .rv-also { font-size: var(--t-sm); color: var(--ink-2); line-height: 1.7; }
  .rv-also div {
    padding: var(--sp-2) var(--sp-3); margin-bottom: var(--sp-1);
    border: 1px solid var(--hair); border-radius: var(--r-sm); background: var(--s1);
  }
  .rv-also b {
    display: block; font-size: var(--t-xs); font-weight: 550; letter-spacing: .16em;
    text-transform: uppercase; color: var(--ink-4);
  }
</style>
</head>
<body>
<script src="../../core/registry.js?v=11"></script>
<script src="../../core/arcade.js?v=11"></script>
<script src="../../core/ui.js?v=11"></script>
<script src="../../core/audio.js?v=11"></script>
<script src="../../core/picker.js?v=11"></script>
<script src="../../core/data/countries.js?v=11"></script>
<script src="../../core/data/cluedrop.js?v=11"></script>
<script src="game.js?v=11"></script>
</body>
</html>
