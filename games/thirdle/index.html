<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>THIRDLE · Midnight Arcade</title>
<meta name="theme-color" content="#06050b">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎰</text></svg>">
<link rel="stylesheet" href="../../core/style.css?v=12">
<style>
  /* ==========================================================================
     THIRDLE — game-specific CSS only. Shared .ac-* components come from
     core/style.css and are not restyled, apart from the 44 px tap-target bump
     on this game's own mode pill. Tokens only: the legend swatches below MUST
     resolve to the same variables the tiles do, or the key lies about the board.
     ========================================================================== */

  #grid { display: grid; gap: var(--sp-1); margin: var(--sp-3) auto 0; justify-content: center; }
  #grid .cell { width: var(--cs, 46px); height: var(--cs, 46px); font-size: calc(var(--cs, 46px) * .52); }
  #grid .gap { visibility: hidden; }
  /* an editable square invites a tap; a given letter and a finished grid do not */
  #grid .ac-tile:not(.lock) { cursor: pointer; }
  #grid .ac-tile.lock, #grid .ac-tile.reveal { cursor: default; }

  /* the fourth state — "this letter lives in one of the other two words" */
  .ac-tile.elsewhere { background: var(--purple); border-color: var(--purple); color: var(--bg); }
  .ac-kbd button.elsewhere { background: var(--purple); color: var(--bg); border-color: var(--purple); }
  /* High-contrast mode recolours --ok to blue, which sits far too close to the
     violet of the fourth state. Pink is the one hue left that is unlike blue,
     orange and the dark empty tile all at once. */
  body.cb .ac-tile.elsewhere,
  body.cb .ac-kbd button.elsewhere { background: var(--pink); border-color: var(--pink); }
  body.cb .key .k-else { background: var(--pink); }

  .ac-tile.lock { box-shadow: inset 0 0 0 2px var(--amber); }

  /* THE CURSOR. It must not be --accent: the registry gives this cabinet
     --violet, and --violet IS --purple, i.e. the exact fill of the fourth
     state — so the cursor disappeared the moment it landed on a purple square,
     and everywhere else it read as "this tile is about to go purple". An ink
     ring is the only thing legible against all five backgrounds this board
     paints (empty, green, amber, violet, slate). */
  #grid .ac-tile.cur { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }

  /* The three words are typed in order — across, then down, then across — so
     the squares of the word you are currently in are lifted a shade. It is the
     cheapest possible answer to "which of the three am I filling in?", and it
     keeps the three words reading as three. */
  #grid .ac-tile.inword:not(.ok):not(.near):not(.elsewhere):not(.miss):not(.reveal) {
    background: var(--s2);
  }
  /* the answer, shown after a loss — must NOT be dressed as a correct guess */
  .ac-tile.reveal { background: var(--s2); border-color: var(--hair-2); color: var(--cyan); }

  .key {
    display: flex; gap: var(--sp-3); justify-content: center; flex-wrap: wrap;
    font-size: var(--t-xs); letter-spacing: .08em; color: var(--ink-4);
    margin-top: var(--sp-3);
  }
  .key i {
    display: inline-block; width: 10px; height: 10px; border-radius: 3px;
    vertical-align: -1px; margin-right: var(--sp-1);
  }
  .key .k-ok { background: var(--ok); }
  .key .k-near { background: var(--near); }
  .key .k-else { background: var(--purple); }
  .key .k-miss { background: var(--no); }

  .tries { display: flex; gap: var(--sp-1); justify-content: center; margin-top: var(--sp-3); }
  .tries i { width: 24px; height: 5px; border-radius: var(--r-full); background: var(--hair-2); }
  .tries i.used { background: var(--bad); }
  .tries i.won { background: var(--ok); }

  .th-modes { margin-top: var(--sp-3); }
  .th-modes .ac-pill { min-height: 44px; text-decoration: none; cursor: pointer; }

  /* The three answers on the result sheet. Scoped as `.ac-modal p.th-words`,
     NOT `.th-words`: core/style.css styles `.ac-modal p` with two selectors, so
     a bare one-class rule loses on specificity and the answers render as
     12.5px body ink instead of the amber line they are meant to be. */
  .ac-modal p.th-words {
    margin: var(--sp-2) 0 2px; font-family: var(--mono); font-size: var(--t-lg);
    font-weight: 600; letter-spacing: .16em; color: var(--amber); line-height: 1.4;
  }
</style>
</head>
<body>
<script src="../../core/registry.js?v=12"></script>
<script src="../../core/arcade.js?v=12"></script>
<script src="../../core/ui.js?v=12"></script>
<script src="../../core/audio.js?v=12"></script>
<script src="../../core/data/words.js?v=12"></script>
<script src="game.js?v=13"></script>
</body>
</html>
