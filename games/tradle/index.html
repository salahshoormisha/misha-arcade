<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TRADLE · Midnight Arcade</title>
<meta name="theme-color" content="#0a0910">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
<link rel="stylesheet" href="../../core/style.css?v=9">
<style>
  #mapwrap { position: relative; width: min(420px, 92vw); margin: var(--sp-3) auto 0; }
  #tree {
    width: 100%; display: block; border-radius: var(--r-md); background: var(--s1);
    box-shadow: var(--sh-2);
  }

  .legend {
    display: flex; flex-wrap: wrap; gap: var(--sp-1) var(--sp-3); justify-content: center;
    max-width: 420px; margin: var(--sp-2) auto 0; font-size: var(--t-xs);
    letter-spacing: .08em; color: var(--ink-3); text-transform: uppercase;
  }
  .legend span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .legend i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; flex: 0 0 auto; }

  .rem { max-width: 420px; margin: var(--sp-3) auto 0; }
  .rembar {
    height: 8px; border-radius: var(--r-full); background: var(--no); overflow: hidden;
    border: 1px solid var(--hair);
  }
  .rembar i { display: block; height: 100%; background: var(--accent);
              transition: width var(--slow) var(--ease); }
  .remtx { font-size: var(--t-xs); letter-spacing: .1em; color: var(--ink-4);
           text-align: center; margin-top: 5px; font-variant-numeric: tabular-nums; }

  .tries { display: flex; gap: var(--sp-1); justify-content: center; margin-top: var(--sp-3); }
  .tries i { width: 26px; height: 5px; border-radius: var(--r-full); background: var(--s3); }
  .tries i.used { background: var(--bad); }
  .tries i.won { background: var(--ok); }

  .hintbox { font-size: var(--t-sm); color: var(--amber); text-align: center;
             margin: var(--sp-3) auto 0; max-width: 420px; line-height: 1.7; }
  .hintbox b { font-size: var(--t-xs); letter-spacing: .16em; text-transform: uppercase;
               color: var(--ink-3); font-weight: 550; margin-right: var(--sp-1); }

  /* guess rows — same markup and metrics as FLAGLE, on purpose */
  .guesses { max-width: 400px; margin: var(--sp-4) auto 0; }
  .gr {
    display: flex; align-items: center; gap: var(--sp-2);
    padding: var(--sp-2) var(--sp-3); margin-bottom: var(--sp-1);
    border: 1px solid var(--hair); border-radius: var(--r-md);
    background: var(--s1); font-size: var(--t-sm);
  }
  .gr img { width: 26px; height: 17px; object-fit: cover; border-radius: 2px; flex: 0 0 auto; }
  .gr .nm { flex: 1 1 auto; min-width: 0; letter-spacing: .04em;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gr .km { flex: 0 0 auto; white-space: nowrap; color: var(--ink-3);
            font-size: var(--t-xs); font-variant-numeric: tabular-nums; }
  .gr .ar { flex: 0 0 auto; font-size: var(--t-md); line-height: 1; }
  .gr .pc { flex: 0 0 auto; width: 42px; text-align: right; font-weight: 650;
            font-variant-numeric: tabular-nums; }
  .gr.win { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); }
  .gr.win .pc { color: var(--ok); }
  .gr.win .ar { color: var(--ok); font-weight: 650; }

  .top3 { font-size: var(--t-sm); line-height: 1.65; text-align: center;
          color: var(--ink-2); margin-top: var(--sp-3); }
  .top3 b { color: var(--ink); font-weight: 620; }
  .caveat { font-size: var(--t-xs); line-height: 1.6; color: var(--ink-4);
            text-align: center; margin-top: var(--sp-2); }
</style>
</head>
<body>
<script src="../../core/registry.js?v=9"></script>
<script src="../../core/arcade.js?v=9"></script>
<script src="../../core/ui.js?v=9"></script>
<script src="../../core/audio.js?v=9"></script>
<script src="../../core/picker.js?v=9"></script>
<script src="../../core/data/countries.js?v=9"></script>
<script src="../../core/data/trade.js?v=9"></script>
<script src="game.js?v=9"></script>
</body>
</html>
