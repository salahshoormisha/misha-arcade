<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TRADLE · Midnight Arcade</title>
<meta name="theme-color" content="#070312">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
<link rel="stylesheet" href="../../core/style.css?v=7">
<style>
  #mapwrap { position: relative; width: min(420px, 92vw); margin: 12px auto 0; }
  #tree {
    width: 100%; display: block; border-radius: 10px; background: #0d0722;
    box-shadow: 0 8px 30px #0008;
  }
  .legend {
    display: flex; flex-wrap: wrap; gap: 5px 10px; justify-content: center;
    max-width: 420px; margin: 9px auto 0; font-size: 10px; letter-spacing: .6px;
    color: var(--ink3); text-transform: uppercase;
  }
  .legend span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .legend i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; flex: 0 0 auto; }
  .rem { max-width: 420px; margin: 11px auto 0; }
  .rembar {
    height: 8px; border-radius: 9px; background: #4a3a7d55; overflow: hidden;
    border: 1px solid var(--line);
  }
  .rembar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), #ffffff55); }
  .remtx { font-size: 10px; letter-spacing: 1px; color: var(--ink4); text-align: center; margin-top: 5px; }
  .tries { display: flex; gap: 5px; justify-content: center; margin-top: 12px; }
  .tries i { width: 26px; height: 5px; border-radius: 9px; background: #ffffff18; }
  .tries i.used { background: var(--bad); }
  .tries i.won { background: var(--ok); }
  .hintbox { font-size: 12px; color: var(--gold); text-align: center; margin-top: 9px; line-height: 1.7;
             max-width: 420px; margin-left: auto; margin-right: auto; }
  /* guess rows — same markup and metrics as FLAGLE, on purpose */
  .guesses { max-width: 400px; margin: 14px auto 0; }
  .gr {
    display: flex; align-items: center; gap: 8px; padding: 8px 11px; margin-bottom: 6px;
    border: 1px solid var(--line); border-radius: 10px; background: #ffffff07; font-size: 13px;
  }
  .gr img { width: 26px; height: 17px; object-fit: cover; border-radius: 2px; flex: 0 0 auto; }
  .gr .nm { flex: 1 1 auto; letter-spacing: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gr .km { color: var(--ink3); font-size: 11.5px; }
  .gr .ar { font-size: 15px; }
  .gr .pc { width: 42px; text-align: right; font-weight: 800; }
  .gr.win { border-color: var(--ok); background: rgba(61,224,138,.1); }
  .gr.win .pc { color: var(--ok); }
  .top3 { font-size: 12.5px; line-height: 1.65; text-align: center; color: var(--ink2); margin-top: 10px; }
  .top3 b { color: #fff; }
  .caveat { font-size: 10.5px; line-height: 1.6; color: var(--ink4); text-align: center; margin-top: 8px; }
</style>
</head>
<body>
<script src="../../core/registry.js?v=7"></script>
<script src="../../core/arcade.js?v=7"></script>
<script src="../../core/ui.js?v=7"></script>
<script src="../../core/audio.js?v=7"></script>
<script src="../../core/picker.js?v=7"></script>
<script src="../../core/data/countries.js?v=7"></script>
<script src="../../core/data/trade.js?v=7"></script>
<script src="game.js?v=7"></script>
</body>
</html>
