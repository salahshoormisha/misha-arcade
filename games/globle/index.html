<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GLOBLE · Midnight Arcade</title>
<meta name="theme-color" content="#06050b">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>">
<link rel="stylesheet" href="../../core/style.css?v=8">
<style>
  #globe { width: min(360px, 84vw); height: min(360px, 84vw); display: block;
           margin: var(--sp-2) auto 0; cursor: grab; touch-action: none; }
  #globe:active { cursor: grabbing; }

  .legend { display: flex; align-items: center; gap: 7px; justify-content: center;
            font-size: var(--t-xs); letter-spacing: .14em; color: var(--ink-4);
            margin-top: var(--sp-1); }
  .legend .sw { display: flex; border-radius: var(--r-full); overflow: hidden; }
  .legend .sw i { width: 19px; height: 8px; }

  .best { text-align: center; font-size: var(--t-sm); color: var(--ink-2);
          margin-top: var(--sp-3); letter-spacing: .03em;
          font-variant-numeric: tabular-nums; }
  .best b { color: var(--ink); }

  /* guess rows — shared metrics with FLAGLE / OUTLINE / TRADLE */
  .guesses { max-width: 400px; margin: var(--sp-3) auto 0; }
  .gr { display: flex; align-items: center; gap: var(--sp-2);
        padding: 7px var(--sp-3); margin-bottom: var(--sp-1);
        border: 1px solid var(--hair); border-radius: var(--r-md);
        background: var(--s1); font-size: var(--t-sm); }
  .gr .dot { width: 13px; height: 13px; border-radius: var(--r-sm); flex: 0 0 auto;
             border: 1px solid var(--hair-2); }
  .gr .nm { flex: 1 1 auto; min-width: 0; letter-spacing: .04em;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gr .km { flex: 0 0 auto; white-space: nowrap; color: var(--ink-3);
            font-size: var(--t-xs); font-variant-numeric: tabular-nums; }
  .gr.win { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); }
  .gr.win .km { color: var(--ok); font-weight: 650; }
</style>
</head>
<body>
<script src="../../core/registry.js?v=8"></script>
<script src="../../core/arcade.js?v=8"></script>
<script src="../../core/ui.js?v=8"></script>
<script src="../../core/audio.js?v=8"></script>
<script src="../../core/worldmap.js?v=8"></script>
<script src="../../core/data/countries.js?v=8"></script>
<script src="../../core/data/world.js?v=8"></script>
<script src="../../core/picker.js?v=8"></script>
<script src="game.js?v=8"></script>
</body>
</html>
