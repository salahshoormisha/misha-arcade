<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ATLAS GYM · Midnight Arcade</title>
<meta name="theme-color" content="#0a0910">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
<link rel="stylesheet" href="../../core/style.css?v=12">
<style>
  .prompt { text-align: center; margin: var(--sp-3) auto 0; }
  .prompt .q { font-size: var(--t-xs); letter-spacing: .2em; text-transform: uppercase;
               color: var(--ink-4); }
  .prompt .big {
    font-family: var(--display); font-size: clamp(20px, 5.4vw, 28px); font-weight: 700;
    letter-spacing: .04em; color: var(--ink); margin-top: var(--sp-2); line-height: 1.25;
    text-wrap: balance;
  }
  /* The box is FIXED and the flag is letterboxed inside it. Shipped flags run
     from Nepal at 0.82:1 to Qatar at 4.17:1, so sizing by width alone made the
     picture 293px tall on one question and 58px on the next — which slid the
     answer buttons out from under a finger already on its way down. */
  #qflag { width: min(240px, 62vw); height: min(150px, 39vw); object-fit: contain;
           border-radius: var(--r-sm); display: block;
           margin: var(--sp-3) auto 0; box-shadow: var(--sh-2); background: var(--s1); }
  #qshape { width: min(210px, 54vw); height: min(210px, 54vw); display: block;
            margin: var(--sp-2) auto 0; }
  /* only rendered if the flag SVG fails to load — never a broken-image icon */
  .qflag-miss { width: min(240px, 62vw); height: min(150px, 39vw);
                margin: var(--sp-3) auto 0; padding: var(--sp-4);
                display: grid; place-items: center;
                border: 1px dashed var(--hair-2);
                border-radius: var(--r-sm); background: var(--s1);
                font-size: var(--t-xs); letter-spacing: .12em; text-transform: uppercase;
                color: var(--ink-4); text-align: center; }

  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-2);
          max-width: 440px; margin: var(--sp-4) auto 0; }
  .opts button {
    background: var(--s1); border: 1px solid var(--hair-2); border-radius: var(--r-md);
    color: var(--ink); padding: var(--sp-3) var(--sp-2); font-size: var(--t-sm);
    cursor: pointer; min-height: 52px; letter-spacing: .02em; text-wrap: balance;
    transition: transform var(--fast) var(--ease), background var(--fast) var(--ease);
  }
  .opts button:hover { background: var(--s3); }
  .opts button:active { transform: scale(.98); }
  .opts button.right { background: var(--ok); color: var(--bg-far); border-color: var(--ok); font-weight: 700; }
  .opts button.wrong { background: var(--bad); color: var(--ink); border-color: var(--bad); }
  .opts button[disabled] { cursor: default; }

  .prog { display: flex; gap: 3px; justify-content: center; margin-top: var(--sp-3); }
  .prog i { width: 15px; height: 5px; border-radius: var(--r-full); background: var(--s3); }
  .prog i.ok { background: var(--ok); }
  .prog i.no { background: var(--bad); }

  .weak { max-width: 440px; margin: var(--sp-5) auto 0; font-size: var(--t-xs);
          color: var(--ink-3); line-height: 1.9; text-align: center; }
  .weak b { color: var(--amber); font-weight: 600; }
  .weak em { font-style: normal; letter-spacing: .16em; text-transform: uppercase;
             color: var(--ink-4); }
</style>
</head>
<body>
<script src="../../core/registry.js?v=12"></script>
<script src="../../core/arcade.js?v=12"></script>
<script src="../../core/ui.js?v=12"></script>
<script src="../../core/audio.js?v=12"></script>
<script src="../../core/worldmap.js?v=12"></script>
<script src="../../core/flagart.js?v=12"></script>
<script src="../../core/data/countries.js?v=12"></script>
<script src="../../core/data/flags.js?v=13"></script>
<script src="../../core/data/world.js?v=12"></script>
<script src="game.js?v=12"></script>
</body>
</html>
