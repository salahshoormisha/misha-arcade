<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MIDI · Midnight Arcade</title>
<meta name="theme-color" content="#0a0910">
<meta name="description" content="A themed 7×7 crossword against the clock. Reveal a square and you keep the solve but lose the streak.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>▧</text></svg>">
<link rel="stylesheet" href="../../core/style.css?v=14">
<style>
  /* ==========================================================================
     MIDI — game-specific CSS only.

     Written against the design system in core/style.css: its surface ramp
     (--s1/--s2/--s3), spacing scale (--sp-*), type scale (--t-*), radii
     (--r-*) and single easing pair (--fast/--ease). No literal colours, no
     arbitrary sizes — a retheme of core/style.css retunes this page with it.

     Shared .ac-* components are not restyled, with one exception the system
     asks for anyway: the pills this game puts in its own toolbar get bumped to
     a 44 px tap target.
     ========================================================================== */

  /* ── title card — a themed midi shows its title from the very start ─────── */

  #midi-title {
    max-width: 460px; margin: var(--sp-3) auto 0;
    padding: var(--sp-2) var(--sp-4); text-align: center;
    background: var(--s1); border: 1px solid var(--hair); border-radius: var(--r-md);
  }
  #midi-title b {
    display: block; font-family: var(--display);
    font-size: var(--t-sm); font-weight: 650; letter-spacing: .16em; color: var(--ink);
  }
  #midi-title span {
    display: block; margin-top: 2px;
    font-size: var(--t-xs); letter-spacing: .04em; color: var(--ink-4);
  }

  /* ── toolbar: clock, par, pencil, help, clues ───────────────────────────── */

  #midibar {
    display: flex; align-items: center; justify-content: center;
    gap: var(--sp-2); flex-wrap: wrap; margin-top: var(--sp-3);
  }
  #midibar .ac-pill { min-height: 44px; padding: 0 var(--sp-4); }
  /* The clock is monospaced and a fixed width, so ticking can never nudge the
     row around and re-centre the whole toolbar. */
  #mi-timer {
    min-width: 98px; justify-content: center;
    font-family: var(--mono); font-variant-numeric: tabular-nums;
    font-size: var(--t-sm); font-weight: 600; letter-spacing: .04em; color: var(--ink);
  }
  #midibar .ac-pill.flat { color: var(--ink-4); }

  /* ── the grid ───────────────────────────────────────────────────────────── */

  #gridwrap { position: relative; width: max-content; max-width: 100%; margin: var(--sp-4) auto 0; }
  #grid {
    display: grid;
    gap: 4px;                     /* must equal GAP in game.js — it sizes the cells */
    background: var(--bg);        /* the gaps become the grid's ink */
    border-radius: 6px;
    /* The bezel is drawn with spread shadows rather than a border or padding:
       shadows never widen the box, so a 375 px phone cannot get a horizontal
       scrollbar no matter how the cell arithmetic rounds. */
    box-shadow: 0 0 0 3px var(--bg), 0 0 0 4px var(--hair), var(--sh-3);
  }
  .cell {
    position: relative; height: var(--cs, 44px);
    display: grid; place-items: center;
    background: var(--s2); border-radius: 2px;
    cursor: pointer; user-select: none; -webkit-user-select: none;
    transition: background var(--fast) var(--ease), box-shadow var(--fast) var(--ease);
  }
  .cell.blk { background: transparent; cursor: default; }
  .cell .num {
    position: absolute; top: 2px; left: 3px;
    font-family: var(--mono); font-style: normal; font-weight: 600;
    font-size: clamp(8px, calc(var(--cs, 44px) * .2), 11px);
    line-height: 1; letter-spacing: 0; color: var(--ink-4);
  }
  .cell .ch {
    pointer-events: none;
    font-family: var(--mono); font-weight: 600; line-height: 1;
    font-size: calc(var(--cs, 44px) * .5);
    text-transform: uppercase; color: var(--ink);
  }

  /* Active word and active square. Two steps that must never be mistaken for
     each other — this is the game's primary feedback, so it gets the accent
     and the one warm colour, and nothing else on the page does. */
  .cell.inword { background: var(--s3); }
  .cell.inword .num { color: var(--ink-3); }
  .cell.cur { background: var(--s3); box-shadow: inset 0 0 0 2px var(--amber); }
  .cell.cur .num { color: var(--amber); }
  @supports (background: color-mix(in srgb, white, black)) {
    .cell.inword { background: color-mix(in srgb, var(--cyan) 24%, var(--s2)); }
    .cell.inword .num { color: color-mix(in srgb, var(--cyan) 70%, var(--ink)); }
    .cell.cur { background: color-mix(in srgb, var(--amber) 26%, var(--s2)); }
  }

  .cell.pencil .ch { color: var(--ink-3); }        /* pencil: written, not committed */
  .cell.sure .ch { color: var(--ok); }             /* CHECK said this one is right */
  .cell.shown .ch { color: var(--ink-3); }         /* REVEAL gave you this one */
  /* revealed: a corner flag, so it reads without depending on colour */
  .cell.shown::before {
    content: ""; position: absolute; top: 0; right: 0;
    border-style: solid; border-width: 0 9px 9px 0;
    border-color: transparent var(--bad) transparent transparent;
  }
  /* wrong: a slash, so it reads without depending on colour */
  .cell.wrong::after {
    content: ""; position: absolute; inset: 9%;
    background: linear-gradient(to bottom right,
      transparent calc(50% - 1.4px), var(--bad) calc(50% - 1.4px),
      var(--bad) calc(50% + 1.4px), transparent calc(50% + 1.4px));
  }

  #gridwrap.done #grid { box-shadow: 0 0 0 3px var(--bg), 0 0 0 4px var(--ok), var(--sh-3); }
  #gridwrap.done .cell { cursor: default; }
  #gridwrap.done .cell .ch { color: var(--ok); }
  #gridwrap.done .cell.shown .ch { color: var(--ink-3); }   /* still shows what you were given */

  /* Fully opaque on purpose: the clock is stopped, so the grid must be hidden.
     A see-through mask would make pausing a free way to study the puzzle. */
  #pausemask {
    position: absolute; inset: 0; z-index: 5; display: none;
    background: var(--s1); border-radius: 6px; text-align: center; cursor: pointer;
  }
  #gridwrap.paused #pausemask {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: var(--sp-2);
  }
  #pausemask b {
    font-family: var(--display);
    font-size: var(--t-sm); font-weight: 650; letter-spacing: .2em; color: var(--ink);
  }
  #pausemask small { font-size: var(--t-xs); letter-spacing: .1em; color: var(--ink-4); }

  /* ── clue bar (sits directly above the keyboard) ─────────────────────────── */

  /* --gw is the grid's exact pixel width, published by sizeGrid(), so the bar
     and the grid stay flush at every viewport instead of guessing with a %. */
  #cluebar {
    display: flex; align-items: stretch;
    width: var(--gw, 100%); max-width: 100%; margin: var(--sp-3) auto 0;
    background: var(--s1); border: 1px solid var(--hair); border-radius: var(--r-md);
    overflow: hidden;
  }
  #cluebar .nav {
    flex: 0 0 46px; min-height: 70px; cursor: pointer;
    background: none; border: none; color: var(--ink-3); font-size: var(--t-lg); line-height: 1;
    transition: background var(--fast) var(--ease), color var(--fast) var(--ease);
  }
  #cluebar .nav:hover { color: var(--ink); background: var(--s2); }
  #cluebar .nav:active { background: var(--s3); }
  /* 70px is two lines of clue. The longest clue in the pool is 32 characters,
     which wraps to two lines at 375px — so the bar is the same height for every
     clue and moving between them never shifts the keyboard. */
  #cluebar .txt {
    flex: 1 1 auto; min-width: 0; min-height: 70px; padding: var(--sp-2);
    display: flex; flex-direction: column; justify-content: center; gap: 3px;
    font-size: var(--t-md); line-height: 1.35; color: var(--ink);
  }
  #cluebar .txt b {
    font-family: var(--display); font-size: var(--t-xs); font-weight: 600;
    letter-spacing: .16em; text-transform: uppercase; color: var(--accent);
  }

  /* ── clue lists (beside the grid on wide screens, in a modal on phones) ──── */

  .midi-cols { display: flex; flex-direction: column; align-items: center; }
  .midi-main { width: 100%; min-width: 0; display: flex; flex-direction: column; align-items: center; }
  .midi-side { display: none; }

  #clues { width: 100%; }
  .cl-col + .cl-col { margin-top: var(--sp-4); }
  .cl-col h3 {
    margin-bottom: var(--sp-2); font-family: var(--display);
    font-size: var(--t-xs); font-weight: 650; letter-spacing: .16em;
    text-transform: uppercase; color: var(--ink-4);
  }
  .clue {
    display: flex; gap: var(--sp-2); padding: 6px var(--sp-2);
    border-radius: var(--r-sm); cursor: pointer;
    font-size: var(--t-sm); line-height: 1.45; color: var(--ink-2);
    transition: background var(--fast) var(--ease), color var(--fast) var(--ease);
  }
  .clue b {
    flex: 0 0 auto; min-width: 16px; text-align: right;
    font-family: var(--mono); font-weight: 600; font-variant-numeric: tabular-nums;
    color: var(--ink-4);
  }
  .clue span { min-width: 0; }
  .clue:hover { background: var(--s2); color: var(--ink); }
  .clue.done { color: var(--ink-4); }
  .clue.on { background: var(--s3); color: var(--ink); }
  .clue.on b { color: var(--accent); }

  @media (min-width: 900px) {
    .midi-cols {
      flex-direction: row; align-items: flex-start; justify-content: center;
      gap: var(--sp-5);
    }
    .midi-main { width: auto; flex: 0 0 auto; }
    .midi-side {
      display: block; flex: 1 1 0; min-width: 0; max-width: 340px;
      margin-top: var(--sp-4);
    }
  }

  /* the modal copy takes two columns where there is room for them */
  #mi-modal-clues { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-4); }
  #mi-modal-clues .cl-col + .cl-col { margin-top: 0; }
  @media (max-width: 430px) {
    #mi-modal-clues { grid-template-columns: 1fr; gap: 0; }
    #mi-modal-clues .cl-col + .cl-col { margin-top: var(--sp-4); }
  }

  /* ── the STUCK? sheet, and the result sheet's star line ─────────────────── */

  .ac-modal h3.mi-h {
    margin: var(--sp-4) 0 var(--sp-2); font-family: var(--display);
    font-size: var(--t-xs); font-weight: 650; letter-spacing: .16em;
    text-transform: uppercase; color: var(--ink-4);
  }
  /* the three scope buttons share the row evenly instead of huddling */
  .ac-modal .mi-h + .ac-row .ac-btn { flex: 1 1 0; padding: 0 var(--sp-2); }

  /* The themed title and the time line on the result sheet. Both scoped as
     `.ac-modal p.x` for the same reason as .mi-star below: core's `.ac-modal p`
     is two selectors, so a bare one-class rule silently loses to it. */
  .ac-modal p.mi-theme {
    margin: var(--sp-2) 0 0; font-family: var(--display);
    font-size: var(--t-sm); font-weight: 650; letter-spacing: .16em;
    color: var(--amber);
  }
  .ac-modal p.mi-time { margin-top: var(--sp-2); font-variant-numeric: tabular-nums; }
  .ac-modal p.mi-time b { color: var(--ink); }

  /* GOLD STAR / BLUE STAR — the words name the colours, so the colours match
     the words. Specificity has to clear `.ac-modal p`. */
  .ac-modal p.mi-star {
    margin: var(--sp-3) 0 0; padding: var(--sp-3);
    background: var(--s1); border: 1px solid var(--hair-2); border-radius: var(--r-md);
    font-size: var(--t-sm); line-height: 1.7; text-align: left;
  }
  .ac-modal p.mi-star.gold { border-color: var(--amber); color: var(--amber); }
  .ac-modal p.mi-star.blue { border-color: var(--cyan); color: var(--cyan); }
  .ac-modal p.mi-star b { color: var(--ink); }

  /* ── footer pill, below the keyboard ────────────────────────────────────── */

  #mi-extra { margin-top: var(--sp-4); }
  #mi-extra .ac-pill { min-height: 44px; padding: 0 var(--sp-4); cursor: pointer; }
  #mi-extra .ac-pill:hover { border-color: var(--hair-2); color: var(--ink); background: var(--s2); text-decoration: none; }
</style>
</head>
<body>
<script src="../../core/registry.js?v=14"></script>
<script src="../../core/arcade.js?v=14"></script>
<script src="../../core/ui.js?v=14"></script>
<script src="../../core/audio.js?v=14"></script>
<script src="../../core/data/crosswords.js?v=15"></script>
<script src="game.js?v=14"></script>
</body>
</html>
