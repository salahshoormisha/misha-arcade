<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GEOGRID · Midnight Arcade</title>
<meta name="theme-color" content="#0a0910">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⌗</text></svg>">
<link rel="stylesheet" href="../../core/style.css?v=11">
<style>
  /* ── the strip above the board ─────────────────────────────────────────── */
  .strip {
    display: flex; align-items: center; justify-content: space-between;
    gap: var(--sp-3); margin-top: var(--sp-2);
    font-size: var(--t-xs); letter-spacing: .16em; text-transform: uppercase;
    color: var(--ink-4); font-variant-numeric: tabular-nums;
  }
  .strip b { color: var(--ink); font-weight: 650; letter-spacing: .04em; }
  .strip .low { color: var(--bad); }

  /* ── the board ─────────────────────────────────────────────────────────
     Four columns: one for the row criteria, three for play. The header
     column is deliberately narrow — the criteria wrap to as many lines as
     they need and the play cells keep the space. */
  #gg {
    display: grid; grid-template-columns: 78px repeat(3, minmax(0, 1fr));
    gap: 5px; margin-top: var(--sp-3);
  }
  @media (min-width: 460px) { #gg { grid-template-columns: 104px repeat(3, minmax(0, 1fr)); gap: 6px; } }

  .cnr {
    display: grid; place-items: center; text-align: center; gap: 2px;
    font-size: 9px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink-4); line-height: 1.35; padding: var(--sp-1);
  }
  .cnr b { display: block; font-family: var(--mono); font-size: var(--t-sm);
           color: var(--ink-3); letter-spacing: .02em; font-weight: 700; }

  /* criteria headers double as the atlas: tapping one explains it */
  .gh {
    display: grid; place-items: center; text-align: center;
    padding: var(--sp-2) 5px; cursor: pointer; min-height: 44px;
    background: var(--s1); border: 1px solid var(--hair); border-radius: var(--r-sm);
    color: var(--ink-2); font-family: var(--ui); font-weight: 550;
    font-size: clamp(8.6px, 2.45vw, 11px); line-height: 1.35;
    letter-spacing: .01em; hyphens: auto; overflow: hidden;
    transition: border-color var(--fast) var(--ease), background var(--fast) var(--ease),
                color var(--fast) var(--ease);
  }
  .gh:hover { background: var(--s2); color: var(--ink); }
  .gh.yes { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ink); }
  .gh.no  { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--ink); }
  .gh.arm { border-color: var(--accent); color: var(--ink); }

  /* ── a play cell ───────────────────────────────────────────────────────── */
  .gc {
    position: relative; aspect-ratio: 1 / 1; padding: 3px;
    display: grid; place-items: center; align-content: center; gap: 3px;
    background: var(--s1); border: 1px solid var(--hair-2); border-radius: var(--r-sm);
    cursor: pointer; overflow: hidden; text-align: center;
    transition: border-color var(--fast) var(--ease), background var(--fast) var(--ease);
  }
  .gc:hover:not(.done) { background: var(--s2); }
  .gc.arm { border-color: var(--accent); background: var(--accent-dim); }
  .gc.done { cursor: default; border-color: var(--hair); }
  .gc.rev { border-style: dashed; }

  .gc .plus { font-family: var(--mono); font-size: var(--t-lg); color: var(--ink-4); line-height: 1; }
  .gc .n { font-size: 9px; letter-spacing: .1em; text-transform: uppercase;
           color: var(--ink-4); font-variant-numeric: tabular-nums; }
  .gc img { width: 30px; height: 20px; object-fit: cover; border-radius: 2px;
            box-shadow: 0 0 0 1px rgba(0,0,0,.5); }
  .gc .nm {
    font-size: clamp(8.4px, 2.35vw, 10.5px); line-height: 1.25; color: var(--ink);
    max-width: 100%; overflow: hidden; display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-word;
  }
  .gc .pts {
    font-family: var(--mono); font-size: var(--t-sm); font-weight: 700;
    font-variant-numeric: tabular-nums; line-height: 1;
  }
  .gc .tier { font-size: 8px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-4); }

  .t-common    { color: var(--ink-3); }
  .t-uncommon  { color: var(--cyan); }
  .t-rare      { color: var(--purple); }
  .t-epic      { color: var(--pink); }
  .t-legendary { color: var(--amber); }
  .t-mythical  { color: var(--green); }

  /* ── the guess console ─────────────────────────────────────────────────── */
  #armed {
    margin-top: var(--sp-4); text-align: center; font-size: var(--t-sm);
    color: var(--ink-2); line-height: 1.6; min-height: 40px;
  }
  #armed .x { color: var(--ink-4); margin: 0 6px; }
  #armed b { color: var(--ink); font-weight: 620; }
  #armed .idle { font-size: var(--t-xs); letter-spacing: .16em;
                 text-transform: uppercase; color: var(--ink-4); }
  #pick { margin-top: var(--sp-2); }
  /* The picker's suggestion list is absolutely positioned, so nothing above it
     may clip: this console is deliberately NOT inside a scrolling modal. */
  #pick .ac-picker { max-width: 320px; }

  .legend {
    display: flex; gap: var(--sp-3); justify-content: center; flex-wrap: wrap;
    margin-top: var(--sp-4); font-size: 9px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--ink-4);
  }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 8px; height: 8px; border-radius: var(--r-full); background: currentColor; }

  .acts { margin-top: var(--sp-4); }

  /* ── the post-game learning pane ───────────────────────────────────────── */
  .rvh { font-family: var(--display); font-size: var(--t-sm); font-weight: 650;
         letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3);
         text-align: center; margin: var(--sp-5) 0 var(--sp-3); }
  .rvlist { list-style: none; padding: 0; margin: 0; display: grid; gap: var(--sp-2); }
  .rvlist li { background: var(--s1); border: 1px solid var(--hair);
               border-radius: var(--r-md); padding: var(--sp-3); }
  .rvlist .top { display: flex; align-items: baseline; gap: var(--sp-2); }
  .rvlist .cx { flex: 1 1 auto; min-width: 0; font-size: var(--t-xs);
                letter-spacing: .04em; color: var(--ink-3); line-height: 1.5; }
  .rvlist .pt { flex: 0 0 auto; font-family: var(--mono); font-size: var(--t-sm);
                font-weight: 700; font-variant-numeric: tabular-nums; }
  .rvlist .yours { margin-top: var(--sp-2); font-size: var(--t-sm); color: var(--ink); font-weight: 600; }
  .rvlist .miss { margin-top: 2px; font-size: var(--t-xs); color: var(--ink-4); line-height: 1.6; }
  .rvlist .miss b { color: var(--ink-2); font-weight: 600; }

  .critn { font-size: var(--t-xs); color: var(--ink-4); line-height: 1.7; }
</style>
</head>

<script src="../../core/registry.js?v=11"></script>
<script src="../../core/arcade.js?v=11"></script>
<script src="../../core/ui.js?v=11"></script>
<script src="../../core/audio.js?v=11"></script>
<script src="../../core/data/countries.js?v=11"></script>
<script src="../../core/data/geogrid.js?v=11"></script>
<script src="../../core/picker.js?v=11"></script>
<script src="game.js?v=3"></script>
</body>
</html>
