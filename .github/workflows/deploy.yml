name: Deploy arcade to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Several sessions push to this repo at once. cancel-in-progress would kill a
# deploy mid-flight and leave GitHub's Pages service holding a half-finished
# deployment, which then blocks every later one ("due to in progress
# deployment"). Queueing instead is GitHub's own recommendation for Pages.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 300000        # fail fast rather than hanging for 10 minutes
          error_count: 15
